<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cube XR - SAE 4.02</title>
  <!-- Import de A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- Import de aframe-extras pour l'effet ocean -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <!-- Composant personnalisé pour l'eau avec effet fluide Three.js -->
  <script>
    AFRAME.registerComponent('water-shader', {
      schema: {
        color: { type: 'color', default: '#0077be' },
        opacity: { type: 'number', default: 0.6 },
        speed: { type: 'number', default: 1.0 },
        waveHeight: { type: 'number', default: 0.1 },
        waveFrequency: { type: 'number', default: 2.0 }
      },

      init: function () {
        const data = this.data;
        const el = this.el;

        // Créer une géométrie plane avec beaucoup de subdivisions pour les vagues
        const geometry = new THREE.PlaneGeometry(10, 10, 64, 64);

        // Matériau avec transparence
        const material = new THREE.MeshStandardMaterial({
          color: new THREE.Color(data.color),
          transparent: true,
          opacity: data.opacity,
          side: THREE.DoubleSide,
          metalness: 0.1,
          roughness: 0.3
        });

        // Créer le mesh
        this.mesh = new THREE.Mesh(geometry, material);
        this.mesh.rotation.x = -Math.PI / 2; // Horizontal

        // Ajouter à la scène
        el.setObject3D('mesh', this.mesh);

        // Stocker les positions initiales des vertices
        this.originalPositions = geometry.attributes.position.array.slice();
        this.time = 0;
      },

      tick: function (time, deltaTime) {
        if (!this.mesh) return;

        const data = this.data;
        this.time += deltaTime * 0.001 * data.speed;

        const positions = this.mesh.geometry.attributes.position.array;
        const original = this.originalPositions;

        // Animer chaque vertex pour créer l'effet de vagues
        for (let i = 0; i < positions.length; i += 3) {
          const x = original[i];
          const y = original[i + 1];

          // Créer des vagues sinusoïdales multiples
          const wave1 = Math.sin(x * data.waveFrequency + this.time) * data.waveHeight;
          const wave2 = Math.sin(y * data.waveFrequency * 0.8 + this.time * 1.2) * data.waveHeight * 0.5;
          const wave3 = Math.sin((x + y) * data.waveFrequency * 0.5 + this.time * 0.8) * data.waveHeight * 0.3;

          // Appliquer la hauteur de vague sur l'axe Z (qui devient Y après rotation)
          positions[i + 2] = wave1 + wave2 + wave3;
        }

        this.mesh.geometry.attributes.position.needsUpdate = true;
        this.mesh.geometry.computeVertexNormals();
      }
    });
  </script>

  <style>
    #ar-button {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      font-size: 18px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      z-index: 9999;
    }

    #ar-button:hover {
      background: #c0392b;
    }

    #ar-overlay {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 9999;
    }

    /* Rendre la scène/canvas transparente afin que le passthrough du casque soit visible derrière */
    html,
    body,
    a-scene,
    canvas {
      background: transparent !important;
    }
  </style>
</head>

<body>
  <!-- Bouton pour entrer en mode AR -->
  <div id="ar-overlay">
    <button id="ar-button">Entrer en AR 🥽</button>
  </div>

  <!-- Scène A-Frame avec configuration WebXR native pour AR -->
  <a-scene webxr="mode: immersive-ar; referenceSpaceType: local-floor; overlayElement: #ar-overlay;"
    renderer="colorManagement: true; alpha: true; antialias: true; sortObjects: true" background="color: transparent">

    <!-- Ancre monde : tous les objets 3D sont enfants de cette entité pour rester fixes dans l'espace réel -->
    <a-entity id="world-anchor">

      <!-- Plan au sol avec spotlight bleu vers le haut -->
      <a-plane position="0 0 -2" rotation="-90 0 0" width="10" height="10" color="#222222" opacity="0.8"></a-plane>
      <a-light type="spot" color="#0088ff" intensity="50" position="0 0.1 -2" rotation="0 0 0" angle="90" penumbra="0.5"
        distance="25" decay="0.5"></a-light>

      <!-- Cube rouge - visible dans le monde réel -->
      <a-box position="0 1.5 -2" rotation="0 45 0" color="#e74c3c" width="0.5" height="0.5" depth="0.5"
        animation="property: rotation; to: 0 405 0; dur: 5000; easing: linear; loop: true">
      </a-box>

      <!-- EFFET D'EAU QUI MONTE avec shader Three.js (positionnée dans le monde, pas au niveau de la caméra) -->
      <a-entity id="water-surface" position="0 0 -2"
        animation="property: position; from: 0 0 -2; to: 0 2.5 -2; dur: 20000; easing: easeInOutQuad">

        <!-- Surface d'eau avec effet de vagues fluides -->
        <a-entity id="water-fluid"
          water-shader="color: #0088cc; opacity: 0.65; speed: 1.5; waveHeight: 0.08; waveFrequency: 1.5">
        </a-entity>

        <!-- Deuxième couche d'eau plus claire pour la profondeur -->
        <a-entity position="0 -0.05 0"
          water-shader="color: #00aaff; opacity: 0.3; speed: 0.8; waveHeight: 0.05; waveFrequency: 2.0">
        </a-entity>

        <!-- Particules de bulles (position relative à water-surface, apparaissent à 21.5s) -->
        <a-entity id="bubbles" visible="false">
          <a-sphere position="-0.5 0 0" radius="0.08" color="#ffffff"
            material="shader: flat; emissive: #ffffff; emissiveIntensity: 0.8"
            animation="property: position; from: -0.5 0 0; to: -0.5 1.5 0; dur: 4000; easing: linear; loop: true"></a-sphere>
          <a-sphere position="0.3 0 -0.5" radius="0.06" color="#ffffff"
            material="shader: flat; emissive: #ffffff; emissiveIntensity: 0.8"
            animation="property: position; from: 0.3 0 -0.5; to: 0.3 1.5 -0.5; dur: 3500; easing: linear; loop: true; delay: 500"></a-sphere>
          <a-sphere position="0 0 0.3" radius="0.07" color="#ffffff"
            material="shader: flat; emissive: #ffffff; emissiveIntensity: 0.8"
            animation="property: position; from: 0 0 0.3; to: 0 1.5 0.3; dur: 4500; easing: linear; loop: true; delay: 1000"></a-sphere>
          <a-sphere position="0.7 0 -0.2" radius="0.06" color="#ffffff"
            material="shader: flat; emissive: #ffffff; emissiveIntensity: 0.8"
            animation="property: position; from: 0.7 0 -0.2; to: 0.7 1.5 -0.2; dur: 3800; easing: linear; loop: true; delay: 300"></a-sphere>
          <a-sphere position="-0.3 0 0.5" radius="0.07" color="#ffffff"
            material="shader: flat; emissive: #ffffff; emissiveIntensity: 0.8"
            animation="property: position; from: -0.3 0 0.5; to: -0.3 1.5 0.5; dur: 4200; easing: linear; loop: true; delay: 700"></a-sphere>
          <a-sphere position="0.5 0 0.4" radius="0.065" color="#ffffff"
            material="shader: flat; emissive: #ffffff; emissiveIntensity: 0.8"
            animation="property: position; from: 0.5 0 0.4; to: 0.5 1.5 0.4; dur: 3900; easing: linear; loop: true; delay: 1500"></a-sphere>
          <a-sphere position="-0.7 0 -0.3" radius="0.06" color="#ffffff"
            material="shader: flat; emissive: #ffffff; emissiveIntensity: 0.8"
            animation="property: position; from: -0.7 0 -0.3; to: -0.7 1.5 -0.3; dur: 4100; easing: linear; loop: true; delay: 800"></a-sphere>
          <a-sphere position="0.2 0 0.6" radius="0.065" color="#ffffff"
            material="shader: flat; emissive: #ffffff; emissiveIntensity: 0.8"
            animation="property: position; from: 0.2 0 0.6; to: 0.2 1.5 0.6; dur: 4300; easing: linear; loop: true; delay: 1200"></a-sphere>
          <a-sphere position="-0.6 0 0.2" radius="0.07" color="#ffffff"
            material="shader: flat; emissive: #ffffff; emissiveIntensity: 0.8"
            animation="property: position; from: -0.6 0 0.2; to: -0.6 1.5 0.2; dur: 3700; easing: linear; loop: true; delay: 400"></a-sphere>
          <a-sphere position="0.4 0 -0.4" radius="0.06" color="#ffffff"
            material="shader: flat; emissive: #ffffff; emissiveIntensity: 0.8"
            animation="property: position; from: 0.4 0 -0.4; to: 0.4 1.5 -0.4; dur: 4400; easing: linear; loop: true; delay: 600"></a-sphere>
        </a-entity>
      </a-entity>

      <!-- Lumières -->
      <a-light id="ambient-light" type="ambient" color="#ffffff" intensity="0.6"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.8" position="1 2 1"></a-light>
      <!-- Lumière bleutée sous l'eau -->
      <a-light type="point" color="#0088ff" intensity="2" position="0 0.5 -2"></a-light>
      <!-- Lumières bleues supplémentaires cachées initialement -->
      <a-entity id="blue-lights" visible="false">
        <a-light type="point" color="#0099ff" intensity="3" position="2 2 -2"></a-light>
        <a-light type="point" color="#0099ff" intensity="3" position="-2 2 -2"></a-light>
        <a-light type="point" color="#0066ff" intensity="2.5" position="0 3 0"></a-light>
        <a-light type="point" color="#0066ff" intensity="2.5" position="0 3 -4"></a-light>
      </a-entity>

    </a-entity>

    <!-- Caméra XR (sans rig parent pour éviter les décalages en AR) -->
    <a-camera position="0 1.6 0"></a-camera>
  </a-scene>

  <script>
    // Bouton pour lancer le mode AR avec la méthode native A-Frame
    const arButton = document.getElementById('ar-button');
    const scene = document.querySelector('a-scene');

    arButton.addEventListener('click', async function () {
      // Vérifier si WebXR AR est supporté
      if (!navigator.xr) {
        alert('WebXR non supporté sur ce navigateur');
        return;
      }

      const isArSupported = await navigator.xr.isSessionSupported('immersive-ar');

      if (!isArSupported) {
        alert('Mode AR non supporté. Utilisez un Quest 3 ou un appareil compatible.');
        return;
      }

      try {
        // Utiliser la méthode native d'A-Frame pour entrer en AR
        // Cela gère correctement le reference space et l'ancrage spatial
        scene.enterAR();
        arButton.style.display = 'none';

        // Écouter la sortie du mode AR
        scene.addEventListener('exit-vr', function onExitAR() {
          arButton.style.display = 'block';
          scene.removeEventListener('exit-vr', onExitAR);
        });

        console.log('Mode AR activé - passthrough actif !');

      } catch (err) {
        console.error('Erreur lors du lancement AR:', err);
        alert('Erreur: ' + err.message);
      }
    });

    // Cacher le bouton si AR non supporté
    scene.addEventListener('loaded', async function () {
      if (navigator.xr) {
        const isArSupported = await navigator.xr.isSessionSupported('immersive-ar');
        if (!isArSupported) {
          arButton.textContent = 'AR non disponible';
          arButton.disabled = true;
        }
      } else {
        arButton.textContent = 'WebXR non supporté';
        arButton.disabled = true;
      }

      // Afficher les bulles après 21.5 secondes (quand l'eau a atteint sa hauteur max)
      setTimeout(function () {
        const bubbles = document.getElementById('bubbles');
        if (bubbles) {
          bubbles.setAttribute('visible', 'true');
          console.log('Bulles activées !');
        } else {
          console.error('Élément #bubbles introuvable');
        }

        // Activer les lumières bleues supplémentaires
        const blueLights = document.getElementById('blue-lights');
        if (blueLights) {
          blueLights.setAttribute('visible', 'true');
        }

        // Changer la lumière ambiante en bleu
        const ambientLight = document.getElementById('ambient-light');
        if (ambientLight) {
          ambientLight.setAttribute('color', '#4499ff');
          ambientLight.setAttribute('intensity', '1.2');
        }
      }, 21500);
    });
  </script>
</body>

</html>
