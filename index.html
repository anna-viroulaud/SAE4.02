<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cube XR - SAE 4.02</title>
  <link rel="stylesheet" href="src/styles/style.css">

  <!-- Importation d'A-Frame et des extensions nécessaires -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>


  <!-- Importation des composants -->
  <script src="src/utils/compatibility-shims.js"></script>
  <script src="src/components/water-effect.js"></script>
  <script src="src/components/water-adapter.js"></script>
  <script src="src/components/grab-manager.js"></script>
  <script src="src/components/bubble-spawner.js"></script>
  <script src="src/components/coral-placer.js"></script>
  <script src="src/components/fish-spawner.js"></script>
  <script src="src/components/room-detection.js"></script>
</head>

<body>
  <!-- Bouton pour entrer en mode AR -->
  <div id="ar-overlay">
    <button id="ar-button">Entrer en AR 🥽</button>
  </div>

  <!-- Bouton pour démarrer la partie (apparaît après le scan) -->
  <div id="start-game-overlay">
    <button id="start-game-button">Lancer la partie ▶️</button>
  </div>

  <!-- Chronomètre HTML (pour PC) -->
  <div id="timer-display">1:00</div>

  <!-- Écran de fin de partie (HTML pour PC) -->
  <div id="end-game-screen">
    <div class="end-game-container">
      <h2 class="end-game-title">🎣 Fin de la partie !</h2>
      <div class="score-table-container">
        <table class="score-table">
          <thead>
            <tr>
              <th>Type de poisson</th>
              <th>Quantité</th>
              <th>Points</th>
            </tr>
          </thead>
          <tbody id="score-table-body">
            <!-- Rempli dynamiquement par game-timer.js -->
          </tbody>
        </table>
      </div>
      <div class="end-game-actions">
        <button id="replay-button" class="end-btn replay-btn">🔄 Rejouer</button>
        <button id="quit-button" class="end-btn quit-btn">❌ Quitter</button>
      </div>
    </div>
  </div>

  <!-- Scène A-Frame avec configuration WebXR native pour AR -->
  <a-scene webxr="referenceSpaceType: local-floor; overlayElement: #ar-overlay; requiredFeatures: local-floor, hit-test, plane-detection, mesh-detection; optionalFeatures: depth-sensing, anchors;" room-detection
    grab-manager
    physics="gravity: 0"
    fog="type: exponential; color: #001a33; density: 0.02"
    renderer="colorManagement: true; alpha: true; antialias: true; sortTransparentObjects: true">

    <!-- Assets must be inside a-scene -->
    <a-assets>
      <a-asset-item id="spear-model" src="assets/models/stylized_low-poly_spear.glb"></a-asset-item>
      <a-asset-item id="low_poly_fish" src="assets/models/low_poly_fish.glb"></a-asset-item>
      <a-asset-item id="fish_fish" src="assets/models/Fish.glb"></a-asset-item>
      <a-asset-item id="fish_1" src="assets/models/Fish_1.glb"></a-asset-item>
      <a-asset-item id="fish_2" src="assets/models/Fish_2.glb"></a-asset-item>
      <a-asset-item id="fish_bubbles" src="assets/models/Fish_Bubbles.glb"></a-asset-item>
      <a-asset-item id="nemo" src="assets/models/nemo.glb"></a-asset-item>
      <a-asset-item id="goldfish" src="assets/models/Goldfish.glb"></a-asset-item>
      <a-asset-item id="piranha" src="assets/models/Piranha.glb"></a-asset-item>
      <a-asset-item id="starfish" src="assets/models/Starfish.glb"></a-asset-item>
    </a-assets>

    <!-- Ancre monde : tous les objets 3D sont enfants de cette entité pour rester fixes dans l'espace réel -->
    <a-entity id="world-anchor" fish-spawner="count: 12">

    <!-- Ground for physics collisions -->
    <a-entity id="ground" geometry="primitive: plane; width: 20; height: 20" rotation="-90 0 0" position="0 0 0" visible="false" static-body></a-entity>
      <!-- Les poissons seront générés automatiquement par fish-spawner après le scan de la pièce -->

      <!-- BOUTON DE DÉMARRAGE 3D (visible après le scan, en VR) -->
      <a-entity id="start-button-3d" position="0 1.6 -1" visible="false">
        <!-- Fond du bouton -->
        <a-plane width="0.8" height="0.25" color="#00ff00" opacity="0.9"
          class="clickable"
          event-set__mouseenter="color: #00cc00"
          event-set__mouseleave="color: #00ff00">
        </a-plane>
        <!-- Texte du bouton -->
        <a-text value="LANCER LA PARTIE ▶" align="center" color="#000000" width="1.2" position="0 0 0.01"></a-text>
      </a-entity>

      <!-- CHRONOMÈTRE 3D (VR/AR) - Masqué au départ -->
      <a-entity id="timer-3d" position="0.5 2 -1" visible="false">
        <a-plane width="0.5" height="0.2" color="#000000" opacity="0.7"></a-plane>
        <a-text id="timer-text" value="1:00" align="center" color="#FFD700" width="1" position="0 0 0.01"></a-text>
      </a-entity>

      <!-- PANNEAU POISSON BONUS 3D (VR/AR) - Masqué au départ -->
      <a-entity id="bonus-fish" position="-0.5 2 -1" visible="false">
        <a-plane width="0.6" height="0.3" color="#FFD700" opacity="0.8"></a-plane>
        <!-- 3D preview of the bonus fish -->
        <a-entity id="fish-3d" position="0.12 0.02 0.03" rotation="0 90 0" scale="0.02 0.02 0.02" visible="true"
          animation__rotate="property: rotation; to: 0 450 0; dur: 6000; easing: linear; loop: true">
        </a-entity>
        <a-text id="bonus-fish-text" value="🐠 BONUS\nPIRANHA" align="center" color="#000000" width="1" position="0 -0.05 0.01"></a-text>
      </a-entity>

      <!-- AFFICHAGE DU SCORE 3D (VR/AR) - Masqué au départ -->
      <a-entity id="score-display" position="0 1.8 -1" visible="false">
        <a-plane width="0.8" height="0.15" color="#000000" opacity="0.7"></a-plane>
        <a-text value="Poissons: 0 | Score: 0" align="center" color="#ffffff" width="1.2" position="0 0 0.01"></a-text>
      </a-entity>

      <!-- ÉCRAN DE FIN 3D (VR/AR) - Masqué au départ -->
      <a-entity id="end-screen-3d" position="0 1.6 -1.5" visible="false">
        <!-- Fond de l'écran -->
        <a-plane width="1.3" height="1.8" color="#000000" opacity="0.9"></a-plane>
        
        <!-- Titre -->
        <a-text value="🎣 FIN DE LA PARTIE !" align="center" color="#FFD700" width="2" position="0 0.8 0.01"></a-text>
        
        <!-- Le tableau sera généré dynamiquement par game-timer.js -->
        
        <!-- Boutons -->
        <a-entity position="0 -0.7 0.01">
          <!-- Bouton Rejouer -->
          <a-entity position="-0.35 0 0" class="replay-button-3d clickable">
            <a-plane width="0.5" height="0.15" color="#00ff00" opacity="0.9"></a-plane>
            <a-text value="🔄 Rejouer" align="center" color="#000000" width="1" position="0 0 0.01"></a-text>
          </a-entity>
          
          <!-- Bouton Quitter -->
          <a-entity position="0.35 0 0" class="quit-button-3d clickable">
            <a-plane width="0.5" height="0.15" color="#e74c3c" opacity="0.9"></a-plane>
            <a-text value="❌ Quitter" align="center" color="#ffffff" width="1" position="0 0 0.01"></a-text>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Lumières -->
      <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.8" position="1 2 1"></a-light>
      <!-- Lumière bleutée sous l'eau -->
      <a-light type="point" color="#0088ff" intensity="0.5" position="0 0.5 -2"></a-light>

      <!-- Spear model (replace the blue cube) - grabbable - MASQUÉ AU DÉPART -->
      <a-entity id="spear" weapon position="0 1.45 -0.6" rotation="0 90 0" 
        class="weapon"
        geometry="primitive: box; width: 0.05; height: 0.05; depth: 0.6" 
        material="color: #ff0000; opacity: 0; transparent: true"
        gltf-model="#spear-model"
        scale="0.5 0.5 0.5"
        dynamic-body="mass:1"
        visible="false">
      </a-entity>

      <!-- Les poissons seront générés automatiquement par fish-spawner après le scan de la pièce -->

      <!-- Bubble spawner: spawn intermittently under water inside the detected room - MASQUÉ AU DÉPART -->
      <a-entity id="bubble-spawner" bubble-spawner visible="false"></a-entity>

      <!-- Coral placer: place coral models on yellow visuals and on the floor after scan -->
      <a-entity id="coral-placer" coral-placer></a-entity>

    </a-entity>

    <!-- VR Hands (raycaster ajouté pour interaction 3D) -->
    <a-entity id="leftHand" hand-controls="hand: left; handModelStyle: lowPoly; color: #15ACCF" raycaster="objects: .clickable; showLine: true" line="color: #00ff00"></a-entity>
    <a-entity id="rightHand" hand-controls="hand: right; handModelStyle: lowPoly; color: #15ACCF" raycaster="objects: .clickable; showLine: true" line="color: #00ff00"></a-entity>

    <!-- EFFET D'EAU QUI MONTE avec shader Three.js (positionnée dans le monde, pas au niveau de la caméra) - MASQUÉ AU DÉPART -->
    <a-entity id="water-surface" position="0 0 -2" water-adapter visible="false"
      animation="property: position; from: 0 0 -2; to: 0 2.5 -2; dur: 10000; easing: easeInOutQuad; autoplay: false">

      <!-- Surface d'eau avec effet de vagues fluides (couche principale bleu profond) -->
      <a-entity id="water-fluid"
        visible="false"
        water-shader="color: #004b7f; opacity: 0.75; speed: 1.5; waveHeight: 0.08; waveFrequency: 1.5">
      </a-entity>

      <!-- Deuxième couche d'eau plus claire pour la profondeur -->
      <a-entity position="0 -0.05 0" visible="false"
        water-shader="color: #006fb3; opacity: 0.35; speed: 0.8; waveHeight: 0.05; waveFrequency: 2.0">
      </a-entity>
    </a-entity>

    <!-- (moved bubble-spawner into world-anchor) -->

  </a-scene>

  <script src="src/systems/game-timer.js"></script>
  <script src="src/systems/game-manager.js"></script>
  <script>
    // Gestion des boutons de contrôle du jeu
    document.addEventListener('DOMContentLoaded', function() {
      // Bouton démarrage HTML
      const startButton = document.getElementById('start-game-button');
      if (startButton) {
        startButton.addEventListener('click', function() {
          console.log('▶️ Lancement de la partie');
          if (window.gameTimer) {
            window.gameTimer.startGame();
            startButton.style.display = 'none';
            // Masquer aussi le bouton 3D
            const startButton3D = document.querySelector('#start-button-3d');
            if (startButton3D) startButton3D.setAttribute('visible', 'false');
          }
        });
      }

      // Bouton démarrage 3D (VR)
      const startButton3D = document.querySelector('#start-button-3d');
      if (startButton3D) {
        startButton3D.addEventListener('click', function() {
          console.log('▶️ Lancement de la partie (VR)');
          if (window.gameTimer) {
            window.gameTimer.startGame();
            startButton3D.setAttribute('visible', 'false');
            // Masquer aussi le bouton HTML
            if (startButton) startButton.style.display = 'none';
          }
        });
      }

      // Bouton rejouer HTML
      const replayButton = document.getElementById('replay-button');
      if (replayButton) {
        replayButton.addEventListener('click', function() {
          console.log('🔄 Rejouer');
          if (window.gameTimer) {
            window.gameTimer.resetGame();
            // Réafficher le bouton de démarrage
            if (startButton) startButton.style.display = 'block';
            const startButton3D = document.querySelector('#start-button-3d');
            if (startButton3D) startButton3D.setAttribute('visible', 'true');
          }
        });
      }

      // Bouton rejouer 3D (VR)
      const replayButton3D = document.querySelector('.replay-button-3d');
      if (replayButton3D) {
        replayButton3D.addEventListener('click', function() {
          console.log('🔄 Rejouer (VR)');
          if (window.gameTimer) {
            window.gameTimer.resetGame();
            // Réafficher le bouton de démarrage 3D
            const startButton3D = document.querySelector('#start-button-3d');
            if (startButton3D) startButton3D.setAttribute('visible', 'true');
          }
        });
      }

      // Bouton quitter HTML
      const quitButton = document.getElementById('quit-button');
      if (quitButton) {
        quitButton.addEventListener('click', function() {
          console.log('❌ Quitter');
          if (window.gameTimer) {
            window.gameTimer.resetGame();
          }
          // Fermer l'écran de fin
          const endGameScreen = document.getElementById('end-game-screen');
          if (endGameScreen) endGameScreen.style.display = 'none';
        });
      }

      // Bouton quitter 3D (VR)
      const quitButton3D = document.querySelector('.quit-button-3d');
      if (quitButton3D) {
        quitButton3D.addEventListener('click', function() {
          console.log('❌ Quitter (VR)');
          if (window.gameTimer) {
            window.gameTimer.resetGame();
          }
          // Fermer l'écran de fin 3D
          const endScreen3D = document.querySelector('#end-screen-3d');
          if (endScreen3D) endScreen3D.setAttribute('visible', 'false');
        });
      }

        // Support VR controllers: utiliser triggerdown + raycaster intersections
        const handleControllerTrigger = (handEl) => {
          if (!handEl) return;
          // First attempt: use the raycaster component intersections if available
          const rc = handEl.components && handEl.components.raycaster;
          let intersections = rc && (rc.intersections || rc.intersection) ? (rc.intersections || (rc.intersection ? [rc.intersection] : [])) : [];

          // If no intersections from component, do an explicit Three.js raycast from the controller
          if (!intersections || !intersections.length) {
            try {
              const origin = new AFRAME.THREE.Vector3();
              const direction = new AFRAME.THREE.Vector3(0, 0, -1);
              handEl.object3D.getWorldPosition(origin);
              handEl.object3D.getWorldDirection(direction);
              const raycaster = new AFRAME.THREE.Raycaster(origin, direction.normalize());
              // Gather candidate meshes: all clickable elements in the scene
              const scene = handEl.sceneEl && handEl.sceneEl.object3D ? handEl.sceneEl.object3D : null;
              if (scene) {
                const candidates = [];
                scene.traverse(function(obj) {
                  if (obj.el && obj.el.classList && obj.el.classList.contains && obj.el.classList.contains('clickable')) {
                    candidates.push(obj);
                  }
                });
                const threeInter = raycaster.intersectObjects(candidates, true);
                intersections = threeInter || [];
              }
            } catch (e) {
              console.warn('Raycast fallback failed', e);
              intersections = [];
            }
          }

          if (!intersections || !intersections.length) return;

          // Trouver la première entité cliquable
          for (let inter of intersections) {
            const targetEl = (inter.object && inter.object.el) || inter.el || null;
            if (!targetEl) continue;
            // If we hit a child plane (the clickable), its parent may be the logical button container
            const logicalEl = (targetEl.id === 'start-button-3d' || (targetEl.classList && targetEl.classList.contains('clickable'))) ? targetEl : (targetEl.parentEl || targetEl);
            if (!logicalEl) continue;
            // Allow either the parent container or the inner clickable plane
            if (logicalEl.id === 'start-button-3d' || (logicalEl.classList && logicalEl.classList.contains('clickable'))) {
              console.log('▶️ Lancement de la partie (VR via trigger)');
              if (window.gameTimer) window.gameTimer.startGame();
              // Masquer les boutons
              const sb3 = document.querySelector('#start-button-3d'); if (sb3) sb3.setAttribute('visible', 'false');
              const sbHtml = document.getElementById('start-game-button'); if (sbHtml) sbHtml.style.display = 'none';
              break;
            }
          }
        };

        const rightHand = document.getElementById('rightHand');
        const leftHand = document.getElementById('leftHand');
        if (rightHand) rightHand.addEventListener('triggerdown', () => handleControllerTrigger(rightHand));
        if (leftHand) leftHand.addEventListener('triggerdown', () => handleControllerTrigger(leftHand));

        // --- Visual pointer helpers: show a small dot where the controller ray hits ---
        const sceneEl = document.querySelector('a-scene');
        const makePointer = (id, color) => {
          const s = document.createElement('a-sphere');
          s.setAttribute('id', id);
          s.setAttribute('radius', '0.02');
          s.setAttribute('color', color);
          s.setAttribute('visible', 'false');
          s.setAttribute('segments-width', '6');
          s.setAttribute('segments-height', '6');
          if (sceneEl) sceneEl.appendChild(s);
          return s;
        };
        const rightPointer = makePointer('right-pointer', '#00ff00');
        const leftPointer = makePointer('left-pointer', '#00ff00');

        const raycastFromHand = (handEl) => {
          if (!handEl || !handEl.object3D) return null;
          try {
            const origin = new AFRAME.THREE.Vector3();
            const direction = new AFRAME.THREE.Vector3(0, 0, -1);
            handEl.object3D.getWorldPosition(origin);
            handEl.object3D.getWorldDirection(direction);
            const raycaster = new AFRAME.THREE.Raycaster(origin, direction.normalize());
            const sceneObj = handEl.sceneEl && handEl.sceneEl.object3D ? handEl.sceneEl.object3D : null;
            if (!sceneObj) return null;
            const candidates = [];
            sceneObj.traverse(function(obj) {
              if (obj.el && obj.el.classList && obj.el.classList.contains && obj.el.classList.contains('clickable')) {
                candidates.push(obj);
              }
            });
            // Also include the start-button container itself as candidate
            const startBtn = document.querySelector('#start-button-3d');
            if (startBtn && startBtn.object3D) candidates.push(startBtn.object3D);
            const intersects = raycaster.intersectObjects(candidates, true);
            return (intersects && intersects.length) ? intersects[0] : null;
          } catch (e) {
            return null;
          }
        };

        // Update pointers at ~12 FPS
        const pointerLoop = setInterval(() => {
          // reset start plane color default
          const startPlane = document.querySelector('#start-button-3d a-plane');
          if (startPlane) startPlane.setAttribute('color', '#00ff00');

          [['rightHand', rightPointer], ['leftHand', leftPointer]].forEach(([handId, pointer]) => {
            const hand = document.getElementById(handId);
            if (!hand || !pointer) return;
            const inter = raycastFromHand(hand);
            if (inter) {
              const p = inter.point;
              pointer.setAttribute('position', `${p.x} ${p.y} ${p.z}`);
              pointer.setAttribute('visible', 'true');
              const targetEl = (inter.object && inter.object.el) || inter.el || null;
              if (targetEl) {
                const logicalEl = (targetEl.id === 'start-button-3d' || (targetEl.classList && targetEl.classList.contains('clickable'))) ? targetEl : (targetEl.parentEl || targetEl);
                if (logicalEl && logicalEl.id === 'start-button-3d') {
                  // highlight the start button plane
                  const plane = logicalEl.querySelector && logicalEl.querySelector('a-plane');
                  if (plane) plane.setAttribute('color', '#88ff88');
                }
              }
            } else {
              pointer.setAttribute('visible', 'false');
            }
          });
        }, 80);
    });
  </script>
</body>

</html>
